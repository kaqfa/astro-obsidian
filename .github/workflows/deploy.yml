name: Deploy to Domainesia

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linter
        run: npm run lint --if-present
        continue-on-error: true  # Don't fail build on lint errors

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm test
        continue-on-error: true  # Don't fail build on test errors

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Domainesia via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true  # Stop on first error
          script: |
            echo "🚀 Starting deployment to Domainesia..."

            # Navigate to app directory
            cd ${{ secrets.DEPLOY_PATH }}

            # Show current status
            echo "📂 Current directory: $(pwd)"
            echo "📋 Current branch: $(git branch --show-current)"

            # Backup current deployment (safety measure)
            echo "💾 Creating backup..."
            if [ -d "dist" ]; then
              cp -r dist dist.backup.$(date +%Y%m%d_%H%M%S)
              # Keep only last 3 backups
              ls -dt dist.backup.* | tail -n +4 | xargs rm -rf
            fi

            # Pull latest code
            echo "⬇️  Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # Install dependencies (production only)
            echo "📦 Installing dependencies..."
            npm ci --production --legacy-peer-deps

            # Run database migrations if needed
            echo "🗄️  Running database migrations..."
            if [ -f "migrate.ts" ]; then
              npx tsx migrate.ts || echo "⚠️  Migration failed or already up to date"
            fi

            # Restart Passenger application
            echo "🔄 Restarting Passenger app..."
            mkdir -p tmp
            touch tmp/restart.txt

            # Clean up old backups older than 7 days
            echo "🧹 Cleaning up old backups..."
            find . -name "dist.backup.*" -mtime +7 -exec rm -rf {} \; 2>/dev/null || true

            echo "✅ Deployment completed at $(date)"
            echo "🎉 Application is now live!"

      - name: Upload dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "dist/"
          target: ${{ secrets.DEPLOY_PATH }}/
          strip_components: 0

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            # Check if dist directory exists
            if [ -d "dist" ]; then
              echo "✅ dist directory exists"
              echo "📊 dist size: $(du -sh dist | cut -f1)"
            else
              echo "❌ dist directory not found!"
              exit 1
            fi

            # Check if app is running (optional - may need adjustment based on setup)
            if [ -f "tmp/restart.txt" ]; then
              echo "✅ Passenger restart file created"
            else
              echo "⚠️  Restart file not found"
            fi

            echo "🔍 Deployment verification complete"

      - name: Send deployment notification
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅ Successful' : '❌ Failed';
            const message = `Deployment ${status}\n\nCommit: ${{ github.sha }}\nBranch: ${{ github.ref_name }}\nAuthor: ${{ github.actor }}`;
            console.log(message);
